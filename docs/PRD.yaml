product:
  name: oh-my-cursor
  posture: independent self-developed Cursor-native workflow backbone
  date: 2026-05-06

scope:
  in:
    - public language cleanup for repository-owned surfaces
    - checked-in Cursor project hooks
    - checked-in Cursor project agents
    - local artifact validators
    - conservative runtime and manual smoke evidence
  out:
    - default MCP configuration
    - marketplace publication claims
    - product-managed modes or background-agent provisioning

features:
  public_language_cleanup:
    goal: Keep public docs, skills, rules, app copy, and benchmark notes focused on this repository's own product identity.
    requirements:
      - scan public-facing text for blocked legacy comparison terms
      - keep ownership and proof wording explicit
      - avoid stronger claims than current artifacts and smoke evidence support
  hooks:
    goal: Ship project hooks as repo-owned runtime helpers for trusted Cursor workspaces.
    requirements:
      - define versioned project hook configuration at .cursor/hooks.json
      - emit a discipline and workflow-state reminder on sessionStart
      - emit an observational summary on sessionEnd
      - surface skill, agent, and phase routing hints plus active workflow-state summaries before each submitted prompt
      - keep direct edits to workflow-state.json bounded by asking for confirmation on preToolUse when non-shell editing tools target it
      - validate edited workflow-state.json documents against the schema on postToolUse using only the Python standard library
      - route tool failures to the debugger role and recommend recording failure metadata via the writer on postToolUseFailure
      - link subagent runs to checked-in role prompts on subagentStart and emit observational summaries on subagentStop without requesting auto follow-ups
      - warn on risky shell patterns and ask for confirmation before commands that would corrupt repo-owned state files or the local plugin install path on beforeShellExecution
      - emit evidence notes on afterShellExecution when the recorded command invokes a repo-owned validator, smoke, install/check helper, or the state writer
      - emit a human-visibility reminder on beforeReadFile when the target is a known workflow-state document
      - run claim/proof checks after file edits
      - surface workflow-state anchors on preCompact so context compaction preserves them
      - run conservative completion checks on stop events
      - keep hook scripts stdlib-only and fail-open unless a severe unsupported claim or a severe state-corrupting shell pattern is detected
  agents:
    goal: Ship concise project agents for verification, critique, debugging, security review, planning, and research.
    requirements:
      - store agents under .cursor/agents
      - include valid YAML frontmatter with name, description, model, and readonly fields
      - keep prompts Cursor-native and tied to repository evidence
      - ship orchestrator, planner, and researcher prompts so the orchestration loop has an entry point plus plan/research workers
  orchestration:
    goal: Coordinate hooks, skills, and agents through one explicit, file-backed lifecycle.
    requirements:
      - publish docs/orchestration.md as the orchestration-first entry point
      - ship .cursor/state/workflow-state.schema.json plus a documented example
      - ship skills/phase-controller/SKILL.md as the orchestration entry skill
      - extend stop-gate.py to surface pending acceptance criteria from an active workflow-state file
      - validate state documents locally with scripts/validate-workflow-state.py
      - provide .cursor/state/workflow-state.py plus the scripts/workflow-state.py wrapper so users and agents can intentionally create or update local workflow-state JSON files
  validators:
    goal: Make the new workflow artifacts locally provable.
    requirements:
      - validate public language hygiene
      - validate hook configuration, hook script compilation, agent frontmatter, and plugin references
      - include the new validators in the backbone verification script
  runtime_manual_smoke:
    goal: Provide bounded checks without overstating runtime behavior.
    requirements:
      - feed sample hook JSON to both hook scripts
      - validate hook and agent artifacts locally
      - document runtime behavior as dependent on trusted Cursor workspace execution

acceptance_criteria:
  - docs/PRD.yaml exists and describes the independent product posture.
  - .cursor/hooks.json wires sessionStart, sessionEnd, beforeSubmitPrompt, preToolUse, postToolUse, postToolUseFailure, subagentStart, subagentStop, beforeShellExecution, afterShellExecution, beforeReadFile, afterFileEdit, preCompact, and stop events to checked-in lifecycle hook scripts (session-bootstrap.py, session-summary.py, prompt-router.py, tool-guard.py, state-watcher.py, failure-router.py, subagent-bootstrap.py, subagent-summary.py, shell-guard.py, shell-debrief.py, read-advisor.py, claim-guard.py, compact-reminder.py, and stop-gate.py).
  - .cursor/hooks contains README.md plus stdlib-only Python hook scripts that emit valid JSON.
  - .cursor/agents contains orchestrator, verifier, critic, debugger, security-reviewer, planner, and researcher prompts with valid frontmatter.
  - .cursor/state ships workflow-state.schema.json, workflow-state.example.json, and a README that explains the contract.
  - skills/phase-controller/SKILL.md is the documented orchestration entry skill.
  - docs/orchestration.md is the orchestration-first overview and is referenced from README.md.
  - .cursor-plugin/plugin.json references rules, skills, agents, and hooks.
  - scripts/validate-public-language.py prints PUBLIC_LANGUAGE_OK when public text is clean.
  - scripts/validate-cursor-workflow-artifacts.py prints HOOKS_ARTIFACTS_OK and AGENTS_ARTIFACTS_OK when artifacts are valid.
  - scripts/validate-workflow-state.py prints WORKFLOW_STATE_OK for a valid state document.
  - scripts/workflow-state.py can initialize and update a local workflow-state JSON file.
  - scripts/smoke-cursor-workflow-artifacts.sh exercises both hook scripts and artifact validation.
  - scripts/verify-backbone.sh runs the new validators.
  - Core docs and required skills describe the repository as a self-developed Cursor-native product with artifact-backed proof.