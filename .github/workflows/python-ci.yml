name: Python CI

on:
  pull_request:
    branches:
      - main
    paths:
      - ".cursor/agents/**/*.md"
      - ".cursor/hooks.json"
      - ".cursor/hooks/**/*.py"
      - ".cursor/hooks/**/*.md"
      - ".cursor/rules/**/*.mdc"
      - "AGENTS.md"
      - "benchmark/**/*.py"
      - "scripts/**/*.py"
      - "skills/**/*.md"
      - "rules/**/*.mdc"
      - "docs/**/*.md"
      - "docs/**/*.yaml"
      - ".github/workflows/python-ci.yml"

jobs:
  gates:
    name: Python Gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Docs scan baseline
        run: python3 scripts/count_md_files.py docs

      - name: Compile Python sources
        run: python3 -m compileall benchmark scripts .cursor/hooks

      - name: Validate workflow artifacts
        run: |
          python3 scripts/validate-public-language.py
          python3 scripts/validate-cursor-workflow-artifacts.py
          bash scripts/smoke-cursor-workflow-artifacts.sh

      - name: Run pytest when available
        shell: bash
        run: |
          set -euo pipefail
          if python3 - <<'PY'
          import importlib.util
          import sys
          sys.exit(0 if importlib.util.find_spec("pytest") else 1)
          PY
          then
            python3 -m pytest -q
          else
            # Fallback guidance from plan: when pytest or deps are unavailable,
            # keep compileall + key script checks as the practical baseline.
            echo "pytest is not installed in this runner environment; skipping pytest gate."
            echo "Install test dependencies to enable 'python3 -m pytest -q' in CI."
          fi
