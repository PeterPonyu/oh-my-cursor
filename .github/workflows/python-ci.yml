name: Python CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "agents/**/*.md"
      - "hooks/hooks.json"
      - "hooks/**/*.py"
      - "hooks/**/*.md"
      - "mcp/**"
      - "mcp.json"
      - "src/**"
      - ".cursor/rules/**/*.mdc"
      - ".cursor/mcp.example.json"
      - "rules/**/*.mdc"
      - ".cursor/state/**"
      - ".cursor-plugin/plugin.json"
      - "AGENTS.md"
      - "README.md"
      - "scripts/**/*.py"
      - "scripts/**/*.sh"
      - "skills/**/*.md"
      - "tests/**/*.py"
      - "docs/**/*.md"
      - "docs/**/*.yaml"
      - ".github/workflows/python-ci.yml"

jobs:
  gates:
    name: Python Gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install QA tooling
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ruff mypy pytest

      - name: Docs scan baseline
        run: python3 scripts/count_md_files.py docs

      - name: Discover Python targets
        id: pytargets
        run: |
          # Only walk directories that actually contain .py files. The repo's
          # Python footprint shrank during the TS migration; gates that
          # hard-code paths fail on dirs that exist but contain no Python
          # (or contain TypeScript instead). This step builds the path list
          # at runtime so each tool only sees real Python.
          DIRS=""
          for d in scripts hooks tests src .cursor/state mcp/cursor-state-bridge; do
            if [ -d "$d" ] && [ -n "$(find "$d" -name '*.py' -print -quit 2>/dev/null)" ]; then
              DIRS="$DIRS $d"
            fi
          done
          echo "dirs=$DIRS" >> "$GITHUB_OUTPUT"
          echo "[discover] python dirs: $DIRS"

      - name: Compile Python sources
        if: steps.pytargets.outputs.dirs != ''
        run: python3 -m compileall ${{ steps.pytargets.outputs.dirs }}

      - name: Lint (ruff)
        if: steps.pytargets.outputs.dirs != ''
        run: python3 -m ruff check ${{ steps.pytargets.outputs.dirs }}

      - name: Typecheck (mypy)
        if: steps.pytargets.outputs.dirs != ''
        run: python3 -m mypy --ignore-missing-imports ${{ steps.pytargets.outputs.dirs }}

      - name: Typecheck (.cursor/state specific files)
        run: |
          for f in .cursor/state/_locking.py .cursor/state/workflow-state.py; do
            if [ -f "$f" ]; then python3 -m mypy --ignore-missing-imports "$f"; fi
          done

      - name: Typecheck (mcp/cursor-state-bridge)
        run: |
          if [ -d mcp/cursor-state-bridge ]; then
            cd mcp/cursor-state-bridge
            FILES=""
            for f in __main__.py auth.py jail.py server.py state_io.py; do
              [ -f "$f" ] && FILES="$FILES $f"
            done
            TEST_FILES=$(ls tests/*.py 2>/dev/null || true)
            if [ -n "$FILES$TEST_FILES" ]; then
              python3 -m mypy --ignore-missing-imports --explicit-package-bases $FILES $TEST_FILES
            fi
          fi

      - name: Validate workflow artifacts
        run: |
          for s in scripts/verify-backbone.sh scripts/validate-surface-visibility.sh scripts/smoke-cursor-workflow-artifacts.sh; do
            [ -f "$s" ] && bash "$s"
          done
          for s in scripts/validate-public-language.py scripts/validate-cursor-workflow-artifacts.py; do
            [ -f "$s" ] && python3 "$s"
          done
          true  # tolerate missing validators during TS migration

      - name: Test (pytest)
        run: |
          if [ -n "$(find tests -name 'test_*.py' -o -name '*_test.py' 2>/dev/null | head -1)" ]; then
            python3 -m pytest -q
          else
            echo "no pytest test modules found; skipping"
          fi
