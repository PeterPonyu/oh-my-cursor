name: Python CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "agents/**/*.md"
      - "hooks/hooks.json"
      - "hooks/**/*.py"
      - "hooks/**/*.md"
      - "mcp/**"
      - "mcp.json"
      - "src/**"
      - ".cursor/rules/**/*.mdc"
      - ".cursor/mcp.example.json"
      - "rules/**/*.mdc"
      - ".cursor/state/**"
      - ".cursor-plugin/plugin.json"
      - "AGENTS.md"
      - "README.md"
      - "scripts/**/*.py"
      - "scripts/**/*.sh"
      - "skills/**/*.md"
      - "tests/**/*.py"
      - "docs/**/*.md"
      - "docs/**/*.yaml"
      - ".github/workflows/python-ci.yml"

jobs:
  gates:
    name: Python Gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install QA tooling
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ruff mypy pytest

      - name: Docs scan baseline
        run: python3 scripts/count_md_files.py docs

      - name: Compile Python sources
        run: python3 -m compileall scripts hooks tests src .cursor/state mcp/cursor-state-bridge

      - name: Lint (ruff)
        run: python3 -m ruff check scripts hooks tests src .cursor/state mcp/cursor-state-bridge

      - name: Typecheck (mypy)
        run: |
          python3 -m mypy --ignore-missing-imports scripts hooks tests src
          python3 -m mypy --ignore-missing-imports .cursor/state/_locking.py .cursor/state/workflow-state.py
          (cd mcp/cursor-state-bridge && python3 -m mypy --ignore-missing-imports --explicit-package-bases __main__.py auth.py jail.py server.py state_io.py tests/*.py)

      - name: Validate workflow artifacts
        run: |
          bash scripts/verify-backbone.sh
          bash scripts/validate-surface-visibility.sh
          python3 scripts/validate-public-language.py
          python3 scripts/validate-cursor-workflow-artifacts.py
          bash scripts/smoke-cursor-workflow-artifacts.sh

      - name: Test (pytest)
        run: python3 -m pytest -q
