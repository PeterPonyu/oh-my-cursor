name: Node & TypeScript CI

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/**/*.ts"
      - "hooks/**/*.ts"
      - "src/**/*.ts"
      - "tests/**"
      - "mcp/**"
      - "agents/**"
      - "skills/**"
      - "rules/**"
      - ".cursor/rules/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/**"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/**/*.ts"
      - "hooks/**/*.ts"
      - "src/**/*.ts"
      - "tests/**"
      - "mcp/**"
      - "agents/**"
      - "skills/**"
      - "rules/**"
      - ".cursor/rules/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/**"

jobs:
  ts-gates:
    name: TypeScript validation gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # 22+ required for `node --experimental-strip-types` used by the
          # gate test scripts below. Node 20 does not recognize the flag and
          # exits with "bad option: --experimental-strip-types".
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Run Autopilot and Consensus Gate Tests
        run: node --experimental-strip-types scripts/test-autopilot-gates.ts

      - name: Run Unified Configuration Tests
        run: node --experimental-strip-types scripts/test-unified-config.ts

      - name: Run Backbone Verification Suite
        run: node --experimental-strip-types scripts/verify-backbone.ts

      - name: Validate Surface Inventory (drift guard)
        run: node --experimental-strip-types scripts/validate-surface-inventory.ts

      - name: Validate Workflow State (schema gate)
        run: node --experimental-strip-types scripts/validate-workflow-state.ts .cursor/state/workflow-state.example.json

      - name: Validate Rename References (drift guard)
        run: node --experimental-strip-types scripts/validate-rename-references.ts

      - name: Validate Translation Freshness
        run: node --experimental-strip-types scripts/validate-translation-freshness.ts

      - name: Run Hook Behavior Tests
        run: node --experimental-strip-types --test tests/hooks/*.test.ts

      - name: Run Memory Layer Tests
        run: node --experimental-strip-types --test tests/memory/*.test.ts

      - name: Run Security Regression Tests
        run: node --experimental-strip-types --test tests/security/*.test.ts

      - name: Run MCP Bridge Unit Tests
        run: node --experimental-strip-types --test mcp/cursor-state-bridge/tests/*.test.ts

  e2e-headless:
    name: headless e2e (credential-free)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install pinned cursor-agent
        env:
          CURSOR_AGENT_VERSION: "2026.06.12-01-15-52-7244546"
          CURSOR_AGENT_SHA256: "453411639b4e49090eb2eec8032f5832b3f78a0486ba6e177bd8c0019c5e0c60"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cursor-agent-cli.tar.gz"
          install_root="$HOME/.local/share/cursor-agent/versions/$CURSOR_AGENT_VERSION"
          download_url="https://downloads.cursor.com/lab/${CURSOR_AGENT_VERSION}/linux/x64/agent-cli-package.tar.gz"

          curl -fsSL "$download_url" -o "$archive"
          echo "${CURSOR_AGENT_SHA256}  ${archive}" | sha256sum -c -

          rm -rf "$install_root"
          mkdir -p "$install_root" "$HOME/.local/bin"
          tar --strip-components=1 -xzf "$archive" -C "$install_root"
          chmod +x "$install_root/cursor-agent"
          ln -sf "$install_root/cursor-agent" "$HOME/.local/bin/agent"
          ln -sf "$install_root/cursor-agent" "$HOME/.local/bin/cursor-agent"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$install_root/cursor-agent" --version

      - name: Headless e2e (no credentials)
        run: npm run e2e:headless

  e2e-real:
    name: real journey e2e (consumes model quota)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Structural (no secrets)
        run: npm run e2e:structural

      # Skip-clean gate: without the CURSOR_API_KEY secret the real tier
      # cannot run; skip honestly (log notice, no pass marker) instead of
      # hard-failing every push. The cursor-agent install remains TBD pending
      # a pinnable installer — see docs/known-issues/cursor-agent-installer-pinning.md;
      # its check only fires when the secret IS set, which is the honest signal.
      - name: Gate on credential (skip cleanly when absent)
        id: gate
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -z "$CURSOR_API_KEY" ]; then
            echo "run=0" >> "$GITHUB_OUTPUT"
            echo "::notice::CURSOR_API_KEY secret absent — real journey e2e SKIPPED cleanly (no pass marker emitted)."
          else
            echo "run=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify cursor-agent available
        if: steps.gate.outputs.run == '1'
        run: command -v cursor-agent || { echo "cursor-agent not installed on runner — install step TBD by maintainer (docs/known-issues/cursor-agent-installer-pinning.md)"; exit 1; }

      - name: Real journey
        if: steps.gate.outputs.run == '1'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: npm run e2e:real
