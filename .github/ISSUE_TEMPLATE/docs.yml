name: Documentation
description: Report stale, missing, or unclear documentation.
title: "[Docs]: "
labels: [documentation]
body:
  - type: input
    id: paths
    attributes:
      label: Affected docs paths
      placeholder: README.md, docs/..., docs/zh/...
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: Documentation issue
    validations:
      required: true
  - type: textarea
    id: desired
    attributes:
      label: Desired update
